<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>无障碍卫生助手（语音辅助）</title>
  <meta name="theme-color" content="#0366d6" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <main id="main" role="main" class="container">
    <header class="topbar">
      <h1 id="title" aria-label="无障碍卫生助手">无障碍卫生助手</h1>
      <button id="guideBtn" class="iconBtn" aria-label="点击查看使用指南">使用指南</button>
    </header>

    <section class="card" aria-labelledby="camTitle">
      <h2 id="camTitle">相机检测准备</h2>

      <!-- 隐藏不必要的下拉框对盲人干扰 -->
      <div class="controls" aria-hidden="true" style="display:none;">
        <label for="cameraSelect">选择摄像头</label>
        <select id="cameraSelect"></select>
        <button id="toggleTorch" type="button">闪光灯</button>
        <button id="fullBtn" type="button">全屏拍摄</button>
      </div>

      <div class="videoWrap" aria-live="polite">
        <video id="video" autoplay playsinline muted></video>
        <div id="roi" class="roi" aria-hidden="true"></div>
      </div>

      <div class="row" style="margin-top: 15px;">
        <button id="calibrateBtn" class="big" type="button" aria-label="点击进行白卡校准，推荐在开始前使用">白卡校准（推荐）</button>
        <button id="captureBtn" class="big primary" type="button" aria-label="点击拍照并开始检测">拍照并检测</button>
      </div>

      <div class="hint" id="hintText" aria-live="polite">提示：将纸巾/布平铺，确保光线充足，点击屏幕任意位置即可拍照。</div>
    </section>

    <section class="card" aria-labelledby="resultTitle">
      <h2 id="resultTitle">检测结果</h2>
      <!-- 这是最关键的修改：使用 role="alert" 和 assertive 强制读屏 -->
      <div id="status" class="status" role="alert" aria-live="assertive">准备就绪，请将手机对准检测区域，点击屏幕拍照。</div>

      <div class="resultRow" aria-hidden="true">
        <div class="swatchWrap">
          <div id="swatch" class="swatch"></div>
          <div class="swatchLabel">平均颜色</div>
        </div>
        <pre id="vals" class="vals">—</pre>
      </div>

      <div class="row" style="margin-top: 15px;">
        <button id="repeatBtn" type="button" aria-label="重新播报刚才的检测结果">重复播报</button>
        <button id="exportBtn" type="button" aria-label="导出本次检测的数据">导出结果</button>
      </div>
    </section>

    <footer class="note" aria-hidden="true">
      隐私说明：图片仅在本地处理，不会上传；该工具仅供辅助判断，非医疗诊断。
    </footer>

    <!-- 指南弹窗 -->
    <div id="guideModal" class="modal" aria-hidden="true">
      <div class="modalContent" role="dialog" aria-labelledby="guideTitle">
        <h3 id="guideTitle">使用指南</h3>
        <ul>
          <li>在充足光线下拍摄，后置摄像头效果更好。</li>
          <li>建议先进行白卡校准：把白纸放入框内并点击“白卡校准”。</li>
          <li>把纸巾平铺并将要检测区域置于虚线框内，点击屏幕或“拍照并检测”。</li>
          <li>听到检测结果后，如果需要重听，可以点击“重复播报”。</li>
        </ul>
        <div class="row">
          <button id="closeGuide" aria-label="关闭使用指南">关闭</button>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
